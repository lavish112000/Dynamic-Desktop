name: Code Review Automation

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  automated-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint
      continue-on-error: true

    - name: Run TypeScript type checking
      run: npm run typecheck

    - name: Security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Run automated review helper
      run: node scripts/code-review-helper.js
      continue-on-error: true

    - name: Check build
      run: npm run build
      continue-on-error: true

    - name: Comment PR with review summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Create review summary comment
          const comment = `
          ## 🤖 Automated Code Review Summary
          
          This is an automated check of your pull request. Please review the results and address any issues before requesting human review.
          
          ### ✅ Automated Checks Status
          - **Linting**: Check the "Run ESLint" step above
          - **Type Checking**: Check the "Run TypeScript type checking" step above  
          - **Security**: Check the "Security audit" step above
          - **Build**: Check the "Check build" step above
          
          ### 📋 Manual Review Required
          Please ensure you've completed the [Code Review Checklist](../CODE_REVIEW_CHECKLIST.md) and:
          
          1. **Functional Testing**: Manually test your changes
          2. **Code Quality**: Review for readability and maintainability
          3. **Security**: Check for potential vulnerabilities
          4. **Performance**: Consider impact on application performance
          5. **Documentation**: Update docs if needed
          6. **Tests**: Add/update tests for new functionality
          
          ### 🚀 Next Steps
          1. Fix any failing automated checks above
          2. Complete the PR template checklist
          3. Request review from team members
          4. Address reviewer feedback promptly
          
          ---
          *This comment was automatically generated. For questions about the review process, see [CODE_REVIEW_CHECKLIST.md](../CODE_REVIEW_CHECKLIST.md)*
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate
        comment-summary-in-pr: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'